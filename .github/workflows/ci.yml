name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test
        env:
          LEARNER_CONTEXT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Test backup safeguards
        run: node --test scripts/backup-database.test.mjs

      - name: Build workspaces
        run: pnpm build

      - name: Build API Docker image
        run: docker build --tag practice-plus-plus-api:ci .

  migrate-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: staging-deploy
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check staging deployment configuration
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_STAGING_DEPLOY_HOOK }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
        run: |
          missing=()
          [[ -n "$DIRECT_URL" ]] || missing+=(DIRECT_URL)
          [[ -n "$DEPLOY_HOOK" ]] || missing+=(CLOUDFLARE_STAGING_DEPLOY_HOOK)
          [[ -n "$WORKLOAD_IDENTITY_PROVIDER" ]] || missing+=(GCP_WORKLOAD_IDENTITY_PROVIDER)
          [[ -n "$DEPLOYER_SERVICE_ACCOUNT" ]] || missing+=(GCP_DEPLOYER_SERVICE_ACCOUNT)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing staging deployment configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: practice-plus-plus
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: practice-plus-plus

      - name: Check staging Cloud Run service
        run: |
          service="practice-plus-plus-staging-api"
          if ! gcloud run services describe "$service" --project practice-plus-plus --region us-east5 --format=json >/dev/null; then
            echo "Create the public staging Cloud Run service before enabling staging deployments."
            exit 1
          fi
          invoker_policy=$(gcloud run services get-iam-policy "$service" --project practice-plus-plus --region us-east5 --format=json)
          if ! jq -e '.bindings[]? | select(.role == "roles/run.invoker") | .members[]? | select(. == "allUsers")' <<< "$invoker_policy" >/dev/null; then
            echo "The staging Cloud Run service must allow public invocations before staging deployment."
            exit 1
          fi

      - name: Build and push staging API image
        id: push-staging-api-image
        run: |
          image="us-east5-docker.pkg.dev/practice-plus-plus/practice-plus-plus/api:$GITHUB_SHA"
          gcloud auth configure-docker us-east5-docker.pkg.dev --quiet
          docker build --tag "$image" .
          docker push "$image"
          image_digest=$(docker image inspect "$image" --format='{{index .RepoDigests 0}}')
          if [[ "$image_digest" != *@sha256:* ]]; then
            echo "The pushed staging API image digest could not be read."
            exit 1
          fi
          echo "image=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Apply staging migrations
        run: pnpm --filter @practice-plus-plus/api prisma:migrate:deploy
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Check current main revision
        id: current-main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping staging deployment because main has advanced."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy and verify staging API
        if: steps.current-main.outputs.current == 'true'
        env:
          IMAGE: ${{ steps.push-staging-api-image.outputs.image }}
        run: |
          service="practice-plus-plus-staging-api"
          region="us-east5"
          tag="staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "$IMAGE" != us-east5-docker.pkg.dev/practice-plus-plus/practice-plus-plus/api@sha256:* ]]; then
            echo "The staging API image digest is missing or invalid."
            exit 1
          fi

          gcloud run deploy "$service" \
            --project practice-plus-plus \
            --region "$region" \
            --image "$IMAGE" \
            --service-account practice-plus-plus-staging-api@practice-plus-plus.iam.gserviceaccount.com \
            --min 0 \
            --max 1 \
            --no-traffic \
            --tag "$tag" \
            --set-env-vars "APP_ENV=staging,APP_VERSION=$GITHUB_SHA,SUPABASE_URL=https://gwzxbvqttopjivjtcffn.supabase.co,SUPABASE_PUBLISHABLE_KEY=sb_publishable_9xLsghCTWaVWmRydNaxmOg_Wx8IrARG,WEB_ORIGIN=https://practice-plus-plus-staging.pages.dev" \
            --set-secrets "DATABASE_URL=practice-plus-plus-staging-database-url:latest,ERROR_MONITORING_DSN=practice-plus-plus-staging-error-monitoring-dsn:latest,SUPABASE_SECRET_KEY=practice-plus-plus-staging-supabase-secret-key:latest" \
            --quiet

          service_json=$(gcloud run services describe "$service" --project practice-plus-plus --region "$region" --format=json)
          tagged_revision=$(jq -r --arg tag "$tag" '.status.traffic[]? | select(.tag == $tag) | .revisionName' <<< "$service_json")
          tagged_url=$(jq -r --arg tag "$tag" '.status.traffic[]? | select(.tag == $tag) | .url' <<< "$service_json")
          if [[ -z "$tagged_revision" || -z "$tagged_url" ]]; then
            echo "Cloud Run did not return the tagged staging revision URL."
            exit 1
          fi

          deployed_image=$(gcloud run revisions describe "$tagged_revision" --project practice-plus-plus --region "$region" --format='value(spec.containers[0].image)')
          if [[ "$deployed_image" != "$IMAGE" ]]; then
            echo "The staging Cloud Run revision does not use the prepared image digest."
            exit 1
          fi

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "$tagged_url/health/ready" >/dev/null; then
              ready=true
              break
            fi
            sleep 5
          done
          if [[ "$ready" != "true" ]]; then
            echo "The tagged staging Cloud Run revision did not become ready."
            exit 1
          fi

          gcloud run services update-traffic "$service" \
            --project practice-plus-plus \
            --region "$region" \
            --to-revisions "$tagged_revision=100" \
            --quiet

          service_url=$(gcloud run services describe "$service" --project practice-plus-plus --region "$region" --format='value(status.url)')
          curl --fail --silent --show-error --max-time 10 "$service_url/health/ready" >/dev/null

      - name: Deploy staging frontend
        if: steps.current-main.outputs.current == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_STAGING_DEPLOY_HOOK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "Skipping frontend deployment because main has advanced."
            exit 0
          fi
          if [[ -z "$DEPLOY_HOOK" ]]; then
            echo "The staging frontend deployment hook is required."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 --request POST "$DEPLOY_HOOK" --output /dev/null
